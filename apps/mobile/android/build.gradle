buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 23
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.22"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// AGP 8 requires every Android module to declare a `namespace`. Some older
// React Native native modules (e.g. the PCM audio stream) still rely on the
// deprecated `package` attribute in their AndroidManifest. Inject a namespace
// for any such module so the project builds on AGP 8.
subprojects { subproject ->
    subproject.plugins.withId("com.android.library") {
        subproject.afterEvaluate {
            def androidExt = subproject.extensions.findByName("android")
            if (androidExt != null && androidExt.namespace == null) {
                def manifestFile = subproject.file("src/main/AndroidManifest.xml")
                if (manifestFile.exists()) {
                    def pkg = new groovy.xml.XmlSlurper().parse(manifestFile).@package.text()
                    if (pkg != null && !pkg.isEmpty()) {
                        androidExt.namespace = pkg
                    }
                }
            }
        }
    }
}
